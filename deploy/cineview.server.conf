server {
    server_name 193.203.163.98 193-203-163-98.sslip.io;

    root /var/www/cineview;
    index index.html;

    client_max_body_size 3G;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;

    # Serve lightweight OG page to social crawlers
    location = / {
        if ($http_user_agent ~* "WhatsApp|facebookexternalhit|Twitterbot|TelegramBot|Slackbot|LinkedInBot|Discordbot") {
            rewrite ^ /og.html last;
        }
        try_files $uri $uri/ =404;
    }

    include /etc/nginx/snippets/elevate-whatsapp-location.conf;

    location /clydra/ {
        proxy_pass http://127.0.0.1:8787/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        client_max_body_size 64k;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    location ~* \.(mp4|mkv)$ {
        mp4;
        mp4_buffer_size 1m;
        mp4_max_buffer_size 5m;
        add_header Accept-Ranges bytes;
        add_header Cache-Control "public, max-age=86400";
        add_header Access-Control-Allow-Origin "*";
    }

    location ~* \.(html|css|js|ico|png|jpg|svg|woff2)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    location ~* \.shortcut$ {
        types {
            application/x-shortcut shortcut;
        }
        default_type application/x-shortcut;
        add_header Content-Disposition "attachment";
        add_header X-Content-Type-Options "nosniff" always;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/193-203-163-98.sslip.io/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/193-203-163-98.sslip.io/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 193.203.163.98 193-203-163-98.sslip.io;
    return 301 https://193-203-163-98.sslip.io$request_uri;
}
